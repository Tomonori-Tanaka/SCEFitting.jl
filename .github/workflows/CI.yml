name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: tests — Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # TEST_MODE=all: unit + Aqua + JET. The extension suites (Sunny / GLMNet) run
      # in their own job below; only the oracle stays local-only, because it needs a
      # Magesty checkout that is not published anywhere CI can reach.
      #
      # JULIA_NUM_THREADS > 1 is REQUIRED, not a speed knob: the threaded-vs-serial
      # gates (`test_threading.jl`, and the deterministic basis build in
      # `test_salc.jl`) are vacuous on a single thread.
      - uses: julia-actions/julia-runtest@v1
        env:
          TEST_MODE: all
          JULIA_NUM_THREADS: "4"

  extensions:
    name: extension suite — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [sunny, glmnet]
    steps:
      # `ext/SCEFittingSunnyExt.jl` and `ext/SCEFittingGLMNetExt.jl` are only loaded
      # when their trigger package is present, so NOTHING in the main job compiles
      # them — the extensions were shipping on the strength of a local run. Both
      # triggers are registered packages that install fine here; the suites carry
      # their own environment (`test/<suite>/Project.toml`, `[sources]`-deved onto
      # this checkout), so this also catches a resolver break.
      #
      # The oracle suite is deliberately NOT here: it needs a sibling Magesty
      # checkout, which is not a registered package.
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the ${{ matrix.suite }} environment
        run: julia --project=test/${{ matrix.suite }} -e 'using Pkg; Pkg.instantiate()'
      - name: Run the ${{ matrix.suite }} suite
        run: julia --project=test/${{ matrix.suite }} test/${{ matrix.suite }}/runtests.jl
        env:
          JULIA_NUM_THREADS: "4"

  examples:
    name: runnable examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      # `examples/` carries its own environment (it `dev`s the package and adds
      # Spglib). Each example self-gates with `@assert`s on a recovered coupling —
      # the fence that caught the canonical-member J/2 regression — so they have to
      # RUN somewhere. The docs job executes the tutorials, not these.
      # [Backported from SLCE.jl 575a4e3.]
      - name: Instantiate the examples environment
        run: julia --project=examples -e 'using Pkg; Pkg.instantiate()'
      - name: Run every example
        run: |
          for f in examples/*.jl; do
            echo "::group::$f"
            julia --project=examples "$f"
            echo "::endgroup::"
          done

  downstream:
    name: downstream — SCEMonteCarlo.jl
    runs-on: ubuntu-latest
    steps:
      # SCEMonteCarlo.jl's own CI fires only on ITS pushes, so a breaking change
      # pushed here is invisible until then — this job runs the dependent's suite
      # against the current commit. A deliberate breaking change turns this red
      # until the SCEMonteCarlo commit lands; that red is the signal — do not
      # delete the job for a green tick. [Adapted from SLCE.jl e8b8ee4.]
      - uses: actions/checkout@v4
        with:
          path: SCEFitting.jl
      - uses: actions/checkout@v4
        with:
          repository: Tomonori-Tanaka/SCEMonteCarlo.jl
          path: SCEMonteCarlo.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Develop the path dependency and instantiate
        run: |
          julia --project=SCEMonteCarlo.jl -e '
            using Pkg
            Pkg.develop(path = "SCEFitting.jl")
            Pkg.instantiate()'
      # Default TEST_MODE (compatibility smoke); SCEMonteCarlo's own CI carries the
      # full TEST_MODE=all matrix on both operating systems. Threads pinned — its
      # determinism gates are vacuous at one thread.
      - name: Run SCEMonteCarlo's suite against this commit
        run: julia --project=SCEMonteCarlo.jl -e 'using Pkg; Pkg.test()'
        env:
          JULIA_NUM_THREADS: "4"

  docs:
    name: documentation build
    runs-on: ubuntu-latest
    # `contents: write` is what lets `deploydocs` push the built site to the
    # `gh-pages` branch that GitHub Pages serves. Without it the build still runs
    # and still fails on a broken docstring — it just never publishes.
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path = pwd())); Pkg.instantiate()'
      - name: Build the Documenter site and deploy it to gh-pages
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
